<style>
*{margin:0;padding:0;box-sizing:border-box}

#overlay h1{font-size:clamp(1.2rem,5vw,2.6rem);color:#00e5ff;text-shadow:0 0 20px #00e5ff;text-align:center}
#overlay h2{font-size:clamp(0.7rem,2.5vw,1rem);color:#aaa;margin:8px 0 20px;text-align:center}
#overlay .credit{font-size:clamp(0.8rem,3vw,1rem);color:#00e5ff;margin-bottom:20px;font-weight:bold}
#go{padding:14px 44px;font-size:clamp(0.9rem,3vw,1.1rem);background:linear-gradient(135deg,#00e5ff,#7c4dff);border:none;border-radius:28px;color:#fff;cursor:pointer;box-shadow:0 0 18px rgba(0,229,255,0.4);-webkit-tap-highlight-color:transparent}
#go:hover{transform:scale(1.05)}
#go:active{transform:scale(0.97)}
#hud{position:absolute;top:8px;left:8px;pointer-events:none;z-index:10}
#hud .r{background:rgba(0,0,0,0.6);border:1px solid rgba(0,229,255,0.25);border-radius:6px;padding:4px 8px;margin-bottom:3px;font-size:0.7rem;min-width:0}
#hud .r .l{color:#00e5ff;font-size:0.55rem;text-transform:uppercase;letter-spacing:0.5px;font-weight:bold}
#hud .r .v{font-size:0.85rem;font-variant-numeric:tabular-nums}
#badge{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);padding:8px 20px;border-radius:18px;font-weight:bold;font-size:clamp(0.7rem,2.5vw,1rem);opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:15;white-space:nowrap}
#credit{position:absolute;bottom:8px;right:8px;font-size:0.6rem;color:#00e5ff;z-index:10;opacity:0.7;max-width:50%;text-align:right}
#panel{position:absolute;top:8px;right:8px;width:230px;background:rgba(10,0,21,0.88);border:1px solid rgba(0,229,255,0.3);border-radius:10px;padding:10px;z-index:50;font-size:11px;color:#fff;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#panel button,#panel select,#panel input{-webkit-tap-highlight-color:transparent}
@media(max-width:700px){
  #hud{top:4px;left:4px}
  #hud .r{padding:2px 6px;margin-bottom:2px;font-size:0.6rem}
  #hud .r .l{font-size:0.5rem}
  #hud .r .v{font-size:0.7rem}
  #panel{top:auto;bottom:0;right:0;left:0;width:100%;max-height:45vh;border-radius:10px 10px 0 0;font-size:10px;padding:8px}
  #credit{bottom:auto;top:4px;right:auto;left:4px;font-size:0.5rem;max-width:40%}
}
</style>

<body>
<div id="overlay">
  <h1>Beyblade Spinning Top Simulator</h1>

</div>

<div id="credit">Beyblade Simulator by Cloof Siu | Model: slumber studio (CC-BY-4.0)</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ====== CONSTANTS ======
const G = 9.82, ARENA_R = 1.0, EPS = 1e-6;

// ====== GLOBALS ======
let scene, cam, ren, ctrl, clk;
let paused = false, speed = 1.0, elapsed = 0, started = false;
let mesh, glow, trail, sparks = [], airMesh;
let arrG, arrT, arrA; // force arrows
let log = [], logT = 0;

// ====== TOP STATE ======
const T = {
  phi: 0, theta: 0.02, psi: 0, // euler angles
  omega: 0,                     // spin rate rad/s
  rpm: 0,
  px: 0, pz: 0,                 // position on arena
  vx: 0, vz: 0,                 // linear velocity
  spinning: false, dead: false,
  time: 0, spinTime: 0,
  // physics params
  mass: 0.05,
  I1: 0.000225,  // moment about spin axis
  cmH: 0.02,      // center of mass height
  tilt0: 0.02,    // initial tilt
  trail: []
};

// ====== USER PARAMS ======
const P = {
  rpm: 2500,
  tilt: 5,
  dist: 'Balanced',
  mu: 0.03,
  air: false,
  forces: false,
  trail: true,
  airflow: false
};

function setDist(type) {
  // Larger cmH = more precession drift = more visible movement
  if (type === 'Tip-heavy') { T.I1 = 0.00012; T.cmH = 0.05; }
  else if (type === 'Rim-heavy') { T.I1 = 0.00035; T.cmH = 0.03; }
  else { T.I1 = 0.000225; T.cmH = 0.04; }
}

function estTime() {
  const rate = 0.02 + P.mu * 1.5 + (P.air ? 0.015 : 0);
  return T.omega > 3 ? Math.log(T.omega / 3) / rate : 0;
}

function launch(rpm, tiltDeg) {
  setDist(P.dist);
  T.omega = rpm * 2 * Math.PI / 60;
  T.rpm = rpm;
  T.tilt0 = Math.max(0.008, tiltDeg * Math.PI / 180);
  T.theta = T.tilt0;
  T.phi = Math.random() * Math.PI * 2;
  T.psi = 0;
  T.spinning = true;
  T.dead = false;
  T.time = 0;
  T.spinTime = 0;
  T.px = (Math.random() - 0.5) * 0.04;
  T.pz = (Math.random() - 0.5) * 0.04;
  T.vx = 0; T.vz = 0; // set by caller (button or drag)
  T.trail = [];
  T.launchTime = T.time;
}

function physics(dt) {
  if (!T.spinning) return;
  T.time += dt;
  T.spinTime += dt;

  const m = T.mass, I1 = T.I1, cmH = T.cmH;
  const M = m * G * cmH;
  const oCrit = Math.sqrt(M / I1);

  // Spin decay: realistic 30-60 seconds depending on settings
  const baseR = 0.02;              // bearing friction baseline
  const muR = P.mu * 1.5;          // surface friction (slider)
  const airR = P.air ? 0.015 : 0; // simple linear extra drag when air resistance is on
  const tiltPen = T.theta > 0.35 ? (T.theta - 0.35) * 2.0 : 0;
  const totalRate = baseR + muR + airR + tiltPen;
  T.omega *= Math.exp(-totalRate * dt);
  // Extra fast decay when nearly fallen over
  if (T.theta > 1.0) T.omega *= Math.exp(-2.0 * dt);
  if (T.theta > 1.3) T.omega *= Math.exp(-6.0 * dt);
  if (T.omega < 3) { T.omega = 0; T.rpm = 0; T.spinning = false; T.dead = true; return; }
  T.rpm = T.omega * 60 / (2 * Math.PI);

  // ─── Precession ───
  // ω_p = M / (I₁ · ω)  — precession gets FASTER as top slows
  const phiDot = M / (I1 * T.omega);
  T.phi += phiDot * dt;

  // ─── Tilt dynamics ───
  // stability ratio: 1 when fast (stable upright), 0 when near critical speed
  const stab = Math.max(0, Math.min(1, (T.omega - oCrit * 0.3) / (oCrit * 2)));
  const natural = T.tilt0 + 0.01 * T.spinTime;    // slight natural drift upward
  const fall = Math.PI * 0.45;                     // near-horizontal (top fallen)
  const target = natural + (fall - natural) * Math.pow(1 - stab, 2.5);
  T.theta += (target - T.theta) * Math.min(1, 2.5 * dt);
  // Nutation wobble (gets worse as top slows)
  if (stab < 0.95) {
    const nutAmp = (1 - stab) * 0.04;
    const nutFreq = Math.min(20, T.omega * 0.08);
    T.theta += nutAmp * Math.sin(nutFreq * T.time) * dt;
  }
  T.theta = Math.max(0.005, Math.min(Math.PI * 0.46, T.theta));

  // Visual spin (capped to prevent aliasing)
  T.psi += Math.min(T.omega, 35) * dt;

// ─── Linear motion from precession ───
  // Real tops orbit because the precessing axis shifts the contact point.
  // Drift speed = phiDot × cmH × sin(θ) — multiplied for arena-scale visibility
  if (T.theta > 0.01) {
    const driftSpeed = phiDot * cmH * Math.sin(T.theta) * 15.0;
    T.vx += -Math.sin(T.phi) * driftSpeed * dt;
    T.vz += Math.cos(T.phi) * driftSpeed * dt;
  }
  // Very light linear damping — smooth floor
  const ld = P.air ? 0.995 : 0.998;
  T.vx *= Math.pow(ld, dt * 60);
  T.vz *= Math.pow(ld, dt * 60);

  // Wall collision
  const d = Math.sqrt(T.px * T.px + T.pz * T.pz);
  const wR = ARENA_R - 0.1;
  if (d > wR) {
    const nx = -T.px / d, nz = -T.pz / d;
    const vn = T.vx * nx + T.vz * nz;
    if (vn < 0) {
      T.vx -= 1.6 * vn * nx;
      T.vz -= 1.6 * vn * nz;
      T.omega *= 0.97;
      T.rpm = T.omega * 60 / (2 * Math.PI);
      spawnSparks(new THREE.Vector3(T.px, 0.04, T.pz), 5);
    }
    T.px += nx * (d - wR + 0.002);
    T.pz += nz * (d - wR + 0.002);
  }
  T.px += T.vx * dt;
  T.pz += T.vz * dt;

  // Trail
  T.trail.push(new THREE.Vector3(T.px, 0.003, T.pz));
  if (T.trail.length > 500) T.trail.shift();
}

function syncMesh() {
  if (!mesh) return;
  // Rotation: precession around Y, then tilt, then spin around symmetry axis
  const qP = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), T.phi);
  const tA = new THREE.Vector3(Math.cos(T.phi),0,-Math.sin(T.phi)).normalize();
  const qT = new THREE.Quaternion().setFromAxisAngle(tA, T.theta);
  const sA = new THREE.Vector3(0,1,0).applyQuaternion(qP.clone().multiply(qT)).normalize();
  const qS = new THREE.Quaternion().setFromAxisAngle(sA, T.psi);
  mesh.quaternion.copy(qP).multiply(qT).multiply(qS);
  // Position: mesh origin at center; bottom tip is at local y = -0.086
  // When upright, center at y = 0.086 (tip on ground)
  // When tilted by theta, center rises by 0.086 * cos(theta)
  mesh.position.set(T.px, 0.086 * Math.cos(T.theta), T.pz);
}

// ====== SPARKS ======
function spawnSparks(pos, n) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.004,4,4),
      new THREE.MeshBasicMaterial({color:new THREE.Color().setHSL(0.08+Math.random()*0.05,1,0.5+Math.random()*0.5),transparent:true,opacity:1})
    );
    m.position.copy(pos);
    m.userData = {v:new THREE.Vector3((Math.random()-.5)*1.5,Math.random()*1+.3,(Math.random()-.5)*1.5),l:0.2+Math.random()*0.2};
    m.userData.ml = m.userData.l;
    scene.add(m); sparks.push(m);
  }
}
function updSparks(dt) {
  for (let i = sparks.length-1; i >= 0; i--) {
    const s = sparks[i]; s.userData.l -= dt;
    if (s.userData.l <= 0) { scene.remove(s); s.geometry.dispose(); s.material.dispose(); sparks.splice(i,1); continue; }
    s.userData.v.y -= G*dt; s.position.add(s.userData.v.clone().multiplyScalar(dt));
    s.material.opacity = s.userData.l/s.userData.ml; s.scale.setScalar(s.userData.l/s.userData.ml);
    if (s.position.y < 0) s.position.y = 0;
  }
}

// ====== INIT ======
function init() {
  clk = new THREE.Clock();
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0015);
  scene.fog = new THREE.FogExp2(0x0a0015, 0.06);
  cam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 100);
  cam.position.set(1.6, 1.2, 1.6);
  cam.lookAt(0, 0.05, 0);
  ren = new THREE.WebGLRenderer({antialias:true});
  ren.setSize(innerWidth, innerHeight);
  ren.setPixelRatio(Math.min(devicePixelRatio, 2));
  ren.shadowMap.enabled = true;
  ren.shadowMap.type = THREE.PCFSoftShadowMap;
  ren.toneMapping = THREE.ACESFilmicToneMapping;
  ren.toneMappingExposure = 1.3;
  document.body.appendChild(ren.domElement);

  ctrl = new OrbitControls(cam, ren.domElement);
  ctrl.enableDamping = true; ctrl.dampingFactor = 0.08; ctrl.target.set(0, 0.04, 0);
  ctrl.minDistance = 0.4; ctrl.maxDistance = 4;

  scene.add(new THREE.AmbientLight(0x444466, 0.6));
  const s1 = new THREE.SpotLight(0xffffff, 50); s1.position.set(1.5,3,1); s1.angle=Math.PI/4; s1.penumbra=0.4;
  s1.castShadow=true; s1.shadow.mapSize.set(1024,1024); s1.target.position.set(0,0,0); scene.add(s1); scene.add(s1.target);
  const s2 = new THREE.SpotLight(0x7c4dff, 25); s2.position.set(-1,2.5,-0.5); s2.angle=Math.PI/3; s2.penumbra=0.5;
  s2.castShadow=true; s2.target.position.set(0,0,0); scene.add(s2); scene.add(s2.target);
  const pl = new THREE.PointLight(0x00e5ff, 6, 3); pl.position.set(0,0.4,0); scene.add(pl);

  buildArena();
  mesh = buildTop(0x00e5ff);
  buildGlow();
  buildTrail();
  buildArrows();
  loadModel();
  setupDrag();
  buildGUI();
  syncMesh();

  window.addEventListener('resize', () => {
    cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth,innerHeight);
  });
  loop();
}

function buildArena() {
  const f = new THREE.Mesh(new THREE.CircleGeometry(ARENA_R,64), new THREE.MeshStandardMaterial({color:0x18182e,metalness:0.85,roughness:0.12}));
  f.rotation.x=-Math.PI/2; f.position.y=-0.001; f.receiveShadow=true; scene.add(f);
  for (let i=1;i<=3;i++) {
    const r=ARENA_R*i*0.25;
    const rn=new THREE.Mesh(new THREE.RingGeometry(r-0.004,r+0.004,64),new THREE.MeshBasicMaterial({color:0x2a2a4a,side:THREE.DoubleSide}));
    rn.rotation.x=-Math.PI/2; rn.position.y=0.001; scene.add(rn);
  }
  const dot=new THREE.Mesh(new THREE.CircleGeometry(0.025,16),new THREE.MeshBasicMaterial({color:0x00e5ff}));
  dot.rotation.x=-Math.PI/2; dot.position.y=0.002; scene.add(dot);
  const w=new THREE.Mesh(new THREE.CylinderGeometry(ARENA_R,ARENA_R,0.5,64,1,true),new THREE.MeshStandardMaterial({color:0x2a1a3e,metalness:0.6,roughness:0.3,side:THREE.DoubleSide}));
  w.position.y=0.25; w.receiveShadow=true; scene.add(w);
  const rm=new THREE.MeshBasicMaterial({color:0x00e5ff});
  const r1=new THREE.Mesh(new THREE.TorusGeometry(ARENA_R,0.006,8,64),rm); r1.rotation.x=Math.PI/2; r1.position.y=0.5; scene.add(r1);
  const r2=new THREE.Mesh(new THREE.TorusGeometry(ARENA_R,0.006,8,64),rm.clone()); r2.rotation.x=Math.PI/2; r2.position.y=0.001; scene.add(r2);
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x050010,roughness:0.9}));
  gnd.rotation.x=-Math.PI/2; gnd.position.y=-0.005; gnd.receiveShadow=true; scene.add(gnd);
}

function mk(geo,mat,p){
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial(mat));
  m.castShadow=true; m.receiveShadow=true; if(p)m.position.set(p[0],p[1],p[2]); return m;
}

function buildTop(tint) {
  const S=1.8, g=new THREE.Group();
  g.add(mk(new THREE.CylinderGeometry(0.07*S,0.06*S,0.022*S,32),{color:0x6666bb,metalness:0.85,roughness:0.12,emissive:tint,emissiveIntensity:0.08}));
  const ring=mk(new THREE.TorusGeometry(0.075*S,0.013*S,10,32),{color:0x9999ee,metalness:0.9,roughness:0.08,emissive:tint,emissiveIntensity:0.15});
  ring.rotation.x=Math.PI/2; g.add(ring);
  g.add(mk(new THREE.CylinderGeometry(0.038*S,0.055*S,0.014*S,24),{color:0x5533aa,metalness:0.7,roughness:0.3,emissive:tint,emissiveIntensity:0.05},[0,0.018*S,0]));
  for (let i=0;i<3;i++){
    const a=(i/3)*Math.PI*2;
    const w=mk(new THREE.BoxGeometry(0.042*S,0.007*S,0.016*S),{color:0x7766cc,metalness:0.8,roughness:0.2,emissive:tint,emissiveIntensity:0.08});
    w.position.set(Math.cos(a)*0.038*S,0.001,Math.sin(a)*0.038*S); w.rotation.y=-a+Math.PI/2; g.add(w);
  }
  g.add(mk(new THREE.CylinderGeometry(0.008*S,0.013*S,0.018*S,16),{color:tint,metalness:0.85,roughness:0.1,emissive:tint,emissiveIntensity:0.7},[0,0.027*S,0]));
  g.add(mk(new THREE.ConeGeometry(0.005*S,0.035*S,12),{color:0x555577,metalness:0.95,roughness:0.05},[0,-0.03*S,0]));
  g.userData.isBeyblade=true;
  scene.add(g);
  return g;
}

function buildGlow() {
  glow=new THREE.Mesh(new THREE.CircleGeometry(0.4,32),new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
  glow.rotation.x=-Math.PI/2; glow.position.y=0.003; scene.add(glow);
}

function buildTrail() {
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute([],3));
  trail=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x00e5ff,transparent:true,opacity:0.6}));
  scene.add(trail);
}

function updTrail() {
  if (T.trail.length<2){trail.geometry.setAttribute('position',new THREE.Float32BufferAttribute([],3));return;}
  const p=[]; for(const v of T.trail) p.push(v.x,0.003,v.z);
  trail.geometry.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  trail.geometry.computeBoundingSphere();
}

function buildArrows() {
  arrG=new THREE.ArrowHelper(new THREE.Vector3(0,-1,0),new THREE.Vector3(),0.1,0xff3333); scene.add(arrG);
  arrT=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),0.08,0x3388ff); scene.add(arrT);
  arrA=new THREE.ArrowHelper(new THREE.Vector3(0,1,0),new THREE.Vector3(),0.1,0x33ff88); scene.add(arrA);
}

function updArrows() {
  if (!P.forces||!T.spinning){arrG.visible=arrT.visible=arrA.visible=false;return;}
  arrG.visible=arrT.visible=arrA.visible=true;
  const p=new THREE.Vector3(T.px,0.1,T.pz);
  arrG.position.copy(p); arrG.setDirection(new THREE.Vector3(0,-1,0)); arrG.setLength(0.08,0.02,0.01);
  const ta=new THREE.Vector3(Math.cos(T.phi),0,-Math.sin(T.phi));
  arrT.position.copy(p); arrT.setDirection(ta); arrT.setLength(Math.min(0.12,T.theta*2+0.02),0.02,0.01);
  const sa=new THREE.Vector3(Math.sin(T.theta)*Math.sin(T.phi),Math.cos(T.theta),-Math.sin(T.theta)*Math.cos(T.phi)).normalize();
  arrA.position.copy(p); arrA.setDirection(sa); arrA.setLength(Math.min(0.18,T.omega*0.0003+0.03),0.02,0.01);
}

function buildAirflow() {
  const N=200, g=new THREE.BufferGeometry();
  const p=new Float32Array(N*3), v=new Float32Array(N*3), a=new Float32Array(N);
  for(let i=0;i<N;i++) rstAir(i,p,v,a);
  g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  airMesh=new THREE.Points(g,new THREE.PointsMaterial({color:0x44ddff,size:0.012,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false}));
  airMesh.visible=false; airMesh.userData={v,a,N}; scene.add(airMesh);
}

function rstAir(i,p,v,a){
  const ang=Math.random()*Math.PI*2, r=0.03+Math.random()*0.1;
  p[i*3]=T.px+Math.cos(ang)*r; p[i*3+1]=0.01+Math.random()*0.04; p[i*3+2]=T.pz+Math.sin(ang)*r;
  const sp=0.15+Math.random()*0.2;
  v[i*3]=-Math.sin(ang)*sp+(Math.random()-0.5)*0.02;
  v[i*3+1]=(Math.random()-0.5)*0.01;
  v[i*3+2]=Math.cos(ang)*sp+(Math.random()-0.5)*0.02;
  a[i]=Math.random();
}

function updAir(dt){
  if(!P.airflow||!T.spinning){airMesh.visible=false;return;}
  airMesh.visible=true;
  const pos=airMesh.geometry.attributes.position.array;
  const{v,a,N}=airMesh.userData;
  const sp=Math.min(T.omega/50,5);
  for(let i=0;i<N;i++){
    a[i]+=dt*1.2;
    if(a[i]>1){rstAir(i,pos,v,a);continue;}
    pos[i*3]+=v[i*3]*dt*sp; pos[i*3+1]+=v[i*3+1]*dt; pos[i*3+2]+=v[i*3+2]*dt*sp;
    const dx=pos[i*3]-T.px,dz=pos[i*3+2]-T.pz;
    if(dx*dx+dz*dz>0.5)rstAir(i,pos,v,a);
  }
  airMesh.geometry.attributes.position.needsUpdate=true;
  airMesh.material.opacity=Math.min(0.7,sp*0.3);
}

function loadModel() {
  new GLTFLoader().load('./beyblade.glb',
    (gltf)=>{
      const mdl=gltf.scene;
      const box=new THREE.Box3().setFromObject(mdl);
      const sz=box.getSize(new THREE.Vector3());
      const sc=0.14/Math.max(sz.x,sz.y,sz.z);
      mdl.scale.setScalar(sc);
      const sb=new THREE.Box3().setFromObject(mdl);
      const cen=sb.getCenter(new THREE.Vector3());
      mdl.position.x-=cen.x; mdl.position.z-=cen.z; mdl.position.y-=sb.min.y;
      mdl.traverse(c=>{if(c.isMesh){c.castShadow=true;c.receiveShadow=true;if(c.material){c.material=c.material.clone();c.material.metalness=Math.max(c.material.metalness||0,0.6);c.material.roughness=Math.min(c.material.roughness||1,0.3);}}});
      scene.remove(mesh);
      mesh=mdl; scene.add(mesh);
      console.log('GLB loaded!');
    },
    undefined,
    (e)=>console.warn('No GLB, using fallback:',e.message)
  );
}

// ====== DRAG ======
let dragS=null;
let dragLine=null;
function setupDrag(){
  const cv=ren.domElement;
  cv.addEventListener('pointerdown',(e)=>{
    if(!started)return;
    const m=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
    const rc=new THREE.Raycaster(); rc.setFromCamera(m,cam);
    if(rc.intersectObjects([mesh],true).length>0){dragS={x:e.clientX,y:e.clientY};ctrl.enabled=false;}
  });
  cv.addEventListener('pointermove',(e)=>{
    if(!dragS)return;
    if(!dragLine){
      const geo=new THREE.BufferGeometry();
      geo.setAttribute('position',new THREE.Float32BufferAttribute([0,0,0,0,0,0],3));
      dragLine=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffff00,linewidth:3,transparent:true,opacity:0.8}));
      scene.add(dragLine);
    }
    // Get world-space drag direction by projecting screen delta through camera
    const worldDir=screenDirToWorld(dragS.x,dragS.y,e.clientX,e.clientY);
    const start3D=new THREE.Vector3(T.px,0.05,T.pz);
    const dragDist=Math.sqrt((e.clientX-dragS.x)**2+(e.clientY-dragS.y)**2);
    const end3D=start3D.clone().add(worldDir.multiplyScalar(dragDist*0.003));
    const pos=dragLine.geometry.attributes.position.array;
    pos[0]=start3D.x;pos[1]=start3D.y;pos[2]=start3D.z;
    pos[3]=end3D.x;pos[4]=end3D.y;pos[5]=end3D.z;
    dragLine.geometry.attributes.position.needsUpdate=true;
  });
  cv.addEventListener('pointerup',(e)=>{
    if(!dragS)return;
    const dx=e.clientX-dragS.x, dy=e.clientY-dragS.y, dist=Math.sqrt(dx*dx+dy*dy);
    ctrl.enabled=true;
    if(dragLine){scene.remove(dragLine);dragLine.geometry.dispose();dragLine.material.dispose();dragLine=null;}
    dragS=null;
    if(dist>10){
      const rpm=Math.min(5000, dist*30+500);
      const speed=Math.min(0.8, dist*0.006);
      // Project screen drag into world XZ plane using camera
      const worldDir=screenDirToWorld(e.clientX-dx,e.clientY-dy,e.clientX,e.clientY);
      launch(rpm, P.tilt);
      T.vx=worldDir.x*speed;
      T.vz=worldDir.z*speed;
      spawnSparks(new THREE.Vector3(T.px,0.05,T.pz),25);
    }
  });
}

// Convert a screen-space drag direction into a world-space direction on the XZ ground plane
function screenDirToWorld(sx1,sy1,sx2,sy2){
  // Use raycasting: cast rays at start and end screen positions,
  // intersect with y=0 plane, the difference gives world direction
  const ndc1=new THREE.Vector2((sx1/innerWidth)*2-1,-(sy1/innerHeight)*2+1);
  const ndc2=new THREE.Vector2((sx2/innerWidth)*2-1,-(sy2/innerHeight)*2+1);
  const rc=new THREE.Raycaster();
  rc.setFromCamera(ndc1,cam);
  const r1=rc.ray;
  rc.setFromCamera(ndc2,cam);
  const r2=rc.ray;
  // Intersect rays with y=0 plane: r.origin + t*r.direction, solve for y=0
  const t1=-r1.origin.y/r1.direction.y;
  const t2=-r2.origin.y/r2.direction.y;
  const p1=r1.origin.clone().add(r1.direction.clone().multiplyScalar(t1));
  const p2=r2.origin.clone().add(r2.direction.clone().multiplyScalar(t2));
  const dir=p2.clone().sub(p1);
  dir.y=0;
  dir.normalize();
  return dir;
}

// ====== HUD ======
function hud(){
  document.getElementById('v-rpm').textContent=T.spinning||T.dead?T.rpm.toFixed(0)+' RPM':'--';
  document.getElementById('v-tilt').textContent=(T.theta*180/Math.PI).toFixed(1)+'°';
  document.getElementById('v-L').textContent=T.spinning?(T.I1*T.omega*1e3).toFixed(2)+' ×10⁻³':'--';
  if(T.spinning){const t=estTime();const m=Math.floor(t/60),s=(t%60).toFixed(1);document.getElementById('v-time').textContent=m>0?m+'m '+s+'s':s+'s';}
  else if(T.dead)document.getElementById('v-time').textContent='Stopped';
  else document.getElementById('v-time').textContent='--';
  document.getElementById('v-elapsed').textContent=elapsed.toFixed(1)+' s';
}

function badge(){
  const b=document.getElementById('badge');
  if(T.spinning){
    if(T.rpm>1500){b.textContent='SPINNING';b.style.background='rgba(0,229,255,0.25)';b.style.color='#00e5ff';}
    else if(T.rpm>500){b.textContent='SLOWING DOWN';b.style.background='rgba(255,193,7,0.25)';b.style.color='#ffc107';}
    else{b.textContent='WOBBLING';b.style.background='rgba(255,82,82,0.25)';b.style.color='#ff5252';}
    b.style.opacity='0.8';
  }else if(T.dead){b.textContent='STOPPED -- Press Launch';b.style.background='rgba(255,82,82,0.35)';b.style.color='#ff5252';b.style.opacity='1';}
  else b.style.opacity='0';
}

// ====== LOOP ======
function loop(){
  requestAnimationFrame(loop);
  const rawDt=clk.getDelta();

  // Always sync mesh+glow
  syncMesh();
  if(glow){
    glow.position.set(T.px,0.003,T.pz);
    glow.visible=T.spinning;
    if(T.spinning){
      const i=Math.min(1,T.omega/100);
      glow.material.opacity=i*0.5;
      glow.scale.setScalar(0.1+i*0.15);
    }
  }

  if(!paused && started){
    const dt=Math.min(rawDt,0.04)*speed;
    elapsed+=dt;
    for(let i=0;i<8;i++) physics(dt/8);
    if(P.trail)updTrail();
    updArrows();
    updSparks(dt); badge();
    logT+=dt;
    if(logT>0.1){logT=0;log.push({t:elapsed,rpm:T.rpm,tilt:T.theta,L:T.I1*T.omega,x:T.px,z:T.pz});if(log.length>6000)log.splice(0,1);}
  }

  ctrl.update();
  ren.render(scene,cam);
  if(started)hud();
}

// ====== START ======
document.getElementById('go').addEventListener('click',()=>{
  document.getElementById('overlay').classList.add('gone');
  started=true;
  setTimeout(()=>{document.getElementById('overlay').style.display='none';},600);
  setTimeout(()=>{
    launch(P.rpm,P.tilt);
    // Give initial push so the top starts orbiting
    const dir=Math.random()*Math.PI*2;
    T.vx=Math.cos(dir)*0.12;
    T.vz=Math.sin(dir)*0.12;
  },400);
});

init();
